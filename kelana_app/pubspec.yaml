name: kelana_app
description: "Kelana - AI Itinerary Planner App (Flutter, Riverpod, Gemini & Google Places)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation & Routing
  go_router: ^14.0.0
  
  # Networking
  dio: ^5.4.0
  
  # Interactive Maps & Location
  google_maps_flutter: ^2.6.0
  
  # Local Storage & Preferences
  shared_preferences: ^2.2.2
  
  # Internationalization & Formatting (IDR, Dates)
  intl: ^0.19.0
  
  # Utilities
  uuid: ^4.3.3
  cached_network_image: ^3.3.1
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
